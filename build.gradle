plugins {
    id 'groovy'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graceframework.grace-app' version '2025.0.0-M3'
    id 'org.graceframework.grace-gsp' version '2025.0.0-M3'
}

group = 'org.graceframework.guides'
version = projectVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.graceframework:grace-boot'
    implementation 'org.graceframework:grace-plugin-core'
    implementation 'org.graceframework:grace-plugin-gsp'
    implementation 'org.graceframework.views:grace-views-groovy-templates'
    implementation 'org.apache.groovy:groovy'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register("copyGraceViews", Copy) {
    includeEmptyDirs = false
    from("app/views") {
        include "**/*.tpl"
    }
    into("build/resources/main/views")
}

processResources {
    dependsOn = ["copyGraceViews"]
}

tasks.named('bootRun') {
    jvmArgs('-Dspring.output.ansi.enabled=always')
}

tasks.named('bootJar') {
    classpath "${project.buildDir}/classes/gsp/main"
}
